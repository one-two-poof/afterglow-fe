name: CI/CD Deploy Frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-ec2
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=./apps/web

      - name: Package standalone output
        run: |
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          tar -czf frontend-build.tar.gz -C apps/web/.next/standalone .

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/afterglow-be-key.pem
          chmod 600 ~/.ssh/afterglow-be-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/afterglow-be-key.pem \
            frontend-build.tar.gz \
            "${EC2_USER}@${EC2_HOST}:/opt/afterglow-frontend/frontend-build.tar.gz.new"

      - name: Deploy & restart
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/afterglow-be-key.pem "${EC2_USER}@${EC2_HOST}" '
            set -e
            cd /opt/afterglow-frontend
            rm -rf app.new
            mkdir app.new
            tar -xzf frontend-build.tar.gz.new -C app.new
            rm frontend-build.tar.gz.new
            rm -rf app.old
            [ -d app ] && mv app app.old || true
            mv app.new app
            sudo systemctl restart afterglow-frontend
            sudo systemctl is-active afterglow-frontend
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:3000 > /dev/null; then
                echo
                echo "Health check OK"
                rm -rf app.old
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 3
            done
            echo "Health check failed"
            sudo journalctl -u afterglow-frontend -n 50 --no-pager
            exit 1
          '
