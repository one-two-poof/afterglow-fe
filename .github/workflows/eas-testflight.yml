name: EAS iOS TestFlight

# main에 모바일(또는 모바일이 쓰는 공유 패키지) 변경이 머지되면 EAS에서 iOS 프로덕션
# 빌드 → TestFlight 자동 제출. web 전용 packages/ui 등 앱과 무관한 변경은 트리거 안 함.
# 필요하면 Actions 탭에서 수동 실행(workflow_dispatch)도 가능.
#
# 사전 준비(1회):
# - EAS에 iOS 자격증명(배포 인증서·프로비저닝)과 App Store Connect API 키가 저장돼 있어야 함
#   (최초 `eas build`/`eas submit`을 대화형으로 한 번 돌리면 저장됨 — 이미 완료).
# - GitHub 저장소 Secrets에 EXPO_TOKEN(Expo 대시보드 → Access Tokens에서 발급) 추가.

on:
  push:
    branches: [main]
    paths:
      # 워크플로 파일 자신은 트리거에 넣지 않는다(수정 푸시가 곧바로 빌드를 돌리지 않도록).
      - "apps/mobile/**"
      # 모바일이 의존하는 공유 패키지(web 전용 packages/ui는 제외).
      - "packages/api/**"
      - "packages/stores/**"
      - "packages/tokens/**"
      - "packages/types/**"
      - "packages/ui-native/**"
      - "packages/utils/**"
  workflow_dispatch:

# iOS 빌드는 느리고 유료(빌드 분)라, 동시에 여러 개가 돌지 않게 직렬화한다.
# 진행 중인 빌드는 취소하지 않는다(cancel-in-progress: false).
concurrency:
  group: eas-ios-testflight
  cancel-in-progress: false

jobs:
  build-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 로컬 config plugin(./plugins/withDisableScriptSandboxing) 해석 등에 필요.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # EAS 클라우드에서 빌드 후, 완료되면 App Store Connect(TestFlight)로 자동 제출.
      # 버전/빌드번호는 eas.json(appVersionSource: remote + autoIncrement)이 관리.
      - name: Build iOS and submit to TestFlight
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive --auto-submit
